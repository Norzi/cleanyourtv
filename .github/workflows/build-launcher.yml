name: build-launcher
on:
  workflow_dispatch:
    inputs:
      launcher_id:
        description: applicationId (allowlist identity)
        default: com.ts.launcher
      legacy_wake:
        description: STR wake fix (targetSdk 25)
        default: 'true'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore
            echo "using stored key"
          else
            echo "no secret, key will be generated by the build"
          fi

      - name: Build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PlauncherApplicationId=${{ inputs.launcher_id }} \
            -PlegacyXiaomiWake=${{ inputs.legacy_wake }}

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Key for reuse
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then exit 0; fi
          base64 -w0 ~/.android/debug.keystore > debug.keystore.b64
        # только для первого запуска, потом добавь содержимое в секрет

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: ~/.android/debug.keystore
          if-no-files-found: ignore
